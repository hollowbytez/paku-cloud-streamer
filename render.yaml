services:
  - type: web
    name: paku-cloud-streamer
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: EGRESS_RELAY_SECRET
        sync: false
      - key: PAKU_WEBHOOK_URL
        value: https://paku.pagalonetap7770.workers.dev/relay/stream-event